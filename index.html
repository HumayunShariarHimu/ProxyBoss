<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyBoss</title>
    <style>
        :root {
            --glow-color: #00ff41;
            --bg-color: #050505;
            --terminal-bg: rgba(0, 0, 0, 0.95);
            --accent-blue: #00d4ff;
            --accent-pink: #ff00ff;
            --accent-yellow: #f1c40f;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color); color: var(--glow-color);
            font-family: 'Courier New', Courier, monospace; margin: 0;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .container { width: 95%; max-width: 900px; margin: auto; padding: 15px; }
        header { text-align: center; border-bottom: 2px solid var(--glow-color); margin-bottom: 15px; padding-bottom: 10px; }
        .terminal-box {
            background: var(--terminal-bg); border: 1px solid var(--glow-color);
            height: 60vh; padding: 15px; overflow-y: auto; font-size: 13px;
            box-shadow: inset 0 0 20px #000;
        }
        .stats-bar {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-top: 15px; border: 1px solid var(--glow-color); padding: 10px;
            text-align: center; background: rgba(0, 255, 65, 0.05);
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button {
            background: transparent; color: var(--glow-color); border: 1px solid var(--glow-color);
            padding: 12px; font-family: inherit; cursor: pointer; flex: 1;
            text-transform: uppercase; font-weight: bold;
        }
        button:hover { background: var(--glow-color); color: #000; box-shadow: 0 0 10px var(--glow-color); }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid rgba(0, 255, 65, 0.05); padding-bottom: 2px; }
        .sys-yellow { color: var(--accent-yellow); font-weight: bold; }
        .country-tag { color: var(--accent-blue); font-weight: bold; }
        .port-tag { color: var(--accent-pink); }
        .region-tag { color: #888; font-size: 11px; }
        footer { padding: 15px; text-align: center; font-size: 11px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ProxyBoss</h1>
        <div id="clock">SYSTEM TIME: --:--:--</div>
    </header>

    <div class="terminal-box" id="terminal">
        <div class="log-entry sys-yellow">[SYSTEM] Ready for Hourly Synchronization...</div>
    </div>

    <div class="stats-bar">
        <div>STATUS: <span id="status" style="color:#fff">IDLE</span></div>
        <div>FRESH NODES: <span id="count" style="color:#fff">0</span></div>
        <div style="grid-column: span 2; border-top: 1px solid; padding-top: 5px;">
            NEXT AUTOMATIC BREACH: <span id="timer" style="color: var(--accent-pink)">60:00</span>
        </div>
    </div>

    <div class="controls">
        <button onclick="fetchProxies()">Force Update</button>
        <button onclick="downloadList()">Export Detailed List</button>
    </div>
</div>

<footer>ProxyBoss © Humayun Shariar Himu</footer>

<script>
    const terminal = document.getElementById('terminal');
    const statusTxt = document.getElementById('status');
    const countTxt = document.getElementById('count');
    const timerTxt = document.getElementById('timer');
    
    let proxyStorage = []; 
    let timeLeft = 3600; // ১ ঘণ্টা

    function log(msg, type = '') {
        const div = document.createElement('div');
        div.className = 'log-entry ' + type;
        div.innerHTML = `> ${msg}`;
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
    }

    async function fetchProxies() {
        statusTxt.innerText = "BREACHING...";
        log("CLEARING CACHE & SYNCING FRESH NODES...", "sys-yellow");
        
        // ক্যাশ সমস্যা এড়াতে টাইমস্ট্যাম্প সহ JSON API
        const timestamp = new Date().getTime();
        const api = `https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all&format=json&_=${timestamp}`;

        try {
            const response = await fetch(api);
            if (!response.ok) throw new Error("Connection failed");
            
            const data = await response.json();
            
            if (data.proxies && data.proxies.length > 0) {
                // লটারি লজিক: প্রতিবার নতুন আইপি সামনে আসবে
                proxyStorage = data.proxies.sort(() => Math.random() - 0.5);
                
                countTxt.innerText = proxyStorage.length;
                statusTxt.innerText = "ONLINE";
                timeLeft = 3600; // টাইমার রিসেট ১ ঘণ্টায়

                log(`SUCCESS! ${proxyStorage.length} NEW NODES INJECTED.`, "sys-yellow");

                // ৩০টি আইপি ডিটেইলসহ টার্মিনালে দেখানো
                displayNodes(30);
            }
        } catch (error) {
            log("PRIMARY API FAILED. ATTEMPTING BACKUP TUNNEL...", "sys-yellow");
            fetchBackup();
        }
    }

    async function fetchBackup() {
        const timestamp = new Date().getTime();
        const backupApi = `https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all&_=${timestamp}`;
        
        try {
            const res = await fetch(backupApi);
            const text = await res.text();
            const lines = text.split('\n').filter(l => l.includes(':'));
            
            proxyStorage = lines.map(line => ({
                ip: line.split(':')[0],
                port: line.split(':')[1],
                ip_data: { countryCode: 'UN', regionName: 'Live Node' }
            })).sort(() => Math.random() - 0.5);

            countTxt.innerText = proxyStorage.length;
            statusTxt.innerText = "BACKUP-ON";
            timeLeft = 3600;
            displayNodes(30);
        } catch (e) {
            log("CRITICAL ERROR: ALL SOURCES OFFLINE.", "sys-yellow");
            statusTxt.innerText = "OFFLINE";
        }
    }

    function displayNodes(limit) {
        let i = 0;
        const interval = setInterval(() => {
            if (i < limit && i < proxyStorage.length) {
                const p = proxyStorage[i];
                const country = p.ip_data.countryCode || '??';
                const region = p.ip_data.regionName || 'Global';
                
                log(`<span class="country-tag">[${country}]</span> <span style="color:#fff">${p.ip}</span>:<span class="port-tag">${p.port}</span> <span class="region-tag">(${region})</span>`, "");
                i++;
            } else {
                clearInterval(interval);
            }
        }, 80);
    }

    function downloadList() {
        if(proxyStorage.length === 0) return alert("No data available!");
        const content = proxyStorage.map(p => 
            `${p.ip}:${p.port} | [${p.ip_data.countryCode || 'UN'}] | ${p.ip_data.regionName || 'N/A'}`
        ).join('\n');
        
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ProxyBoss_Detailed_${new Date().getHours()}h.txt`;
        a.click();
        log("SYSTEM: DETAILED LOG EXPORTED.", "sys-yellow");
    }

    // টাইম এবং টাইমার লজিক
    setInterval(() => {
        document.getElementById('clock').innerText = "SYSTEM TIME: " + new Date().toLocaleTimeString();
        
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        timerTxt.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

        // ১ ঘণ্টা পর পর অটো আপডেট
        if (timeLeft <= 0) {
            log("HOURLY CYCLE COMPLETED. FETCHING FRESH NODES...", "sys-yellow");
            fetchProxies();
        }
    }, 1000);

    window.onload = () => setTimeout(fetchProxies, 1000);
</script>
</body>
</html>
